name: Build Windows

# Builds on every push to main (download from the run's Artifacts).
# When the version in src-tauri/tauri.conf.json has no GitHub Release yet,
# the build is signed and published as release vX.Y.Z, with latest.json,
# which installed apps use to update themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Is this a new version?
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          gh release view "v$version" --repo "${{ github.repository }}" *> $null
          $isNew = ($LASTEXITCODE -ne 0) -and ("${{ github.ref }}" -eq "refs/heads/main")
          "version=$version" >> $env:GITHUB_OUTPUT
          "new=$($isNew.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version, new release: $isNew"
          exit 0

      - name: Build
        if: steps.release.outputs.new != 'true'
        run: npx tauri build

      - name: Build release (signed for the updater)
        if: steps.release.outputs.new == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      - name: Collect installer and portable exe
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "out/PC-Airflow-Simulator_${version}_x64-setup.exe"
          Copy-Item src-tauri/target/release/airflowsim.exe "out/PC-Airflow-Simulator_${version}_portable.exe"
          Get-ChildItem out

      - name: Write latest.json for the updater
        if: steps.release.outputs.new == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $sig = Get-Content (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe.sig | Select-Object -First 1).FullName -Raw
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/PC-Airflow-Simulator_${version}_x64-setup.exe"
          $json = @{
            version = $version
            notes = "See the release page for details."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = $url } }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path out/latest.json -Value $json -Encoding utf8NoBOM
          Get-Content out/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: PC-Airflow-Simulator-windows
          path: out/*.exe

      - name: Publish release
        if: steps.release.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            out/*.exe
            out/latest.json

name: Build Windows

# Builds on every push to main (download from the run's Artifacts).
# Pushing a tag like v0.2.0 also publishes a GitHub Release with a signed
# installer and latest.json, which installed apps use to update themselves.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npx tauri build

      - name: Build release (signed for the updater)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      - name: Collect installer and portable exe
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "out/PC-Airflow-Simulator_${version}_x64-setup.exe"
          Copy-Item src-tauri/target/release/airflowsim.exe "out/PC-Airflow-Simulator_${version}_portable.exe"
          Get-ChildItem out

      - name: Write latest.json for the updater
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match app version $version" }
          $sig = Get-Content (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe.sig | Select-Object -First 1).FullName -Raw
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/PC-Airflow-Simulator_${version}_x64-setup.exe"
          $json = @{
            version = $version
            notes = "See the release page for details."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = $url } }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path out/latest.json -Value $json -Encoding utf8NoBOM
          Get-Content out/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: PC-Airflow-Simulator-windows
          path: out/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.exe
            out/latest.json
